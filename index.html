<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firefighting Robot Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a202c; color: white; }
        .control-btn { @apply bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-6 rounded-lg shadow-lg active:scale-95 transition transform duration-150 flex items-center justify-center text-xl; }
        .status-card { @apply bg-gray-800 p-4 rounded-xl shadow border border-gray-700 flex flex-col items-center justify-center; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-4xl mx-auto">

    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-red-500 mb-2"><i class="fas fa-fire-extinguisher mr-2"></i>Firefighter Robot</h1>
        <div class="flex items-center justify-center space-x-2 mt-4">
            <input type="text" id="ipAddress" placeholder="e.g., 192.168.4.1" class="px-3 py-2 text-black rounded bg-gray-200 focus:outline-none w-40 md:w-auto" value="192.168.4.1">
            <button onclick="startPolling()" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded font-semibold transition shadow-lg">Connect</button>
        </div>
        <p id="connectionStatus" class="text-sm mt-3 text-gray-400 font-mono tracking-wide">Not connected</p>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="status-card">
            <i class="fas fa-fire text-orange-500 text-3xl mb-2"></i>
            <span class="text-sm text-gray-400 mb-1">Flame Sensor</span>
            <span id="snsFlame" class="font-bold text-xl">--</span>
        </div>
        <div class="status-card">
            <i class="fas fa-wave-square text-blue-400 text-3xl mb-2"></i>
            <span class="text-sm text-gray-400 mb-1">Distance (Sonar)</span>
            <span id="snsDist" class="font-bold text-xl">-- cm</span>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex flex-col items-center">
            <h2 class="text-xl font-semibold mb-6 text-gray-300">Manual Control</h2>
            
            <!-- Virtual Joystick Zone -->
            <div id="joystick-zone" class="relative w-56 h-56 bg-gray-900 rounded-full mx-auto shadow-[inset_0_4px_10px_rgba(0,0,0,0.6)] border-4 border-gray-700 mb-2 flex items-center justify-center touch-none">
                <span class="text-gray-600 text-sm font-semibold select-none pointer-events-none text-center px-4"><i class="fas fa-gamepad mb-2 text-2xl opacity-50 block"></i>Drag Joystick<br>or Use WASD / Arrows</span>
            </div>
            
            <div class="mt-8 w-full max-w-xs bg-gray-900 p-4 rounded-lg border border-gray-700">
                <label for="speedSlider" class="block text-sm font-semibold text-gray-300 mb-3 flex justify-between items-center">
                    <span><i class="fas fa-tachometer-alt mr-2 text-blue-400"></i> Motor Speed</span>
                    <span id="speedDisplay" class="text-white font-mono bg-gray-800 px-2 py-1 rounded">200</span>
                </label>
                <input type="range" id="speedSlider" min="60" max="255" value="200" 
                       class="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-blue-500"
                       onchange="setSpeed(this.value)" 
                       oninput="document.getElementById('speedDisplay').innerText = this.value">
                <div class="flex justify-between text-xs text-gray-500 mt-2">
                    <span>Slow</span>
                    <span>Fast</span>
                </div>
            </div>

            <div class="mt-6 w-full max-w-xs flex justify-between space-x-3">
                 <button onmousedown="sendCommand('pump_on')" onmouseup="sendCommand('pump_off')" ontouchstart="sendCommand('pump_on')" ontouchend="sendCommand('pump_off')" class="flex-1 bg-blue-500 hover:bg-blue-600 py-3 rounded-lg shadow font-bold transition flex items-center justify-center text-sm"><i class="fas fa-water mr-2"></i>Pump</button>
                 <button onclick="toggleAuto()" id="autoBtn" class="flex-1 bg-purple-600 hover:bg-purple-700 py-3 rounded-lg shadow font-bold transition flex items-center justify-center text-sm"><i class="fas fa-robot mr-2"></i>Auto: OFF</button>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex flex-col">
             <h2 class="text-xl font-semibold mb-4 text-gray-300">System Activity</h2>
             
             <!-- Live Robot Status Text -->
             <div class="flex-1 bg-gray-900 rounded-lg p-4 mb-8 border border-gray-700 overflow-hidden flex items-center justify-center shadow-inner min-h-[100px]">
                 <span id="sysStatus" class="text-xl md:text-2xl font-mono text-green-400 text-center animate-pulse">Waiting for connection...</span>
             </div>

             <!-- Voice Control Interface -->
             <h2 class="text-xl font-semibold mb-3 text-gray-300">Voice Command</h2>
             <button id="voiceBtn" onclick="toggleVoice()" class="w-full bg-green-600 hover:bg-green-700 py-4 rounded-lg font-bold transition flex justify-center items-center shadow-lg">
                 <i class="fas fa-microphone mr-2 text-xl"></i> Start Voice Control
             </button>
             <p id="voiceOutput" class="text-sm text-center text-gray-400 mt-4 h-6 font-mono"></p>
        </div>
    </div>

    <script>
        let isAuto = false;
        let pollInterval;
        let isVoiceActive = false;
        let currentCommand = null; // Tracks the current active direction
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        
        recognition.continuous = true;
        recognition.interimResults = false;

        function getBaseUrl() {
            return `http://${document.getElementById('ipAddress').value}`;
        }

        async function setSpeed(value) {
            try {
                await fetch(`${getBaseUrl()}/command?cmd=speed&value=${value}`);
            } catch (err) {
                console.error("Speed command failed", err);
            }
        }

        async function sendCommand(cmd) {
            try {
                await fetch(`${getBaseUrl()}/command?cmd=${cmd}`);
            } catch (err) {
                console.error("Command failed", err);
            }
        }

        function toggleAuto() {
            isAuto = !isAuto;
            const btn = document.getElementById('autoBtn');
            if (isAuto) {
                btn.classList.replace('bg-purple-600', 'bg-green-500');
                btn.classList.replace('hover:bg-purple-700', 'hover:bg-green-600');
                btn.innerHTML = '<i class="fas fa-robot mr-2"></i>Auto: ON';
                sendCommand('auto_on');
            } else {
                btn.classList.replace('bg-green-500', 'bg-purple-600');
                btn.classList.replace('hover:bg-green-600', 'hover:bg-purple-700');
                btn.innerHTML = '<i class="fas fa-robot mr-2"></i>Auto: OFF';
                sendCommand('auto_off');
            }
        }

        async function fetchStatus() {
            try {
                const res = await fetch(`${getBaseUrl()}/status`);
                const data = await res.json();
                
                document.getElementById('connectionStatus').innerText = "● Connected (Live)";
                document.getElementById('connectionStatus').classList.replace('text-gray-400', 'text-green-500');
                document.getElementById('connectionStatus').classList.replace('text-red-500', 'text-green-500');

                // Update Flame Sensor (0 is fire detected)
                const flameEl = document.getElementById('snsFlame');
                if (data.flame === 0) {
                    flameEl.innerText = 'FIRE DETECTED!';
                    flameEl.className = 'font-bold text-xl text-red-500 animate-pulse';
                } else {
                    flameEl.innerText = 'Safe';
                    flameEl.className = 'font-bold text-xl text-green-500';
                }
                
                document.getElementById('snsDist').innerText = `${data.distance} cm`;
                
                // Update System Status Text dynamically (e.g., "Scanning...")
                const statusEl = document.getElementById('sysStatus');
                statusEl.innerText = data.status;
                if(data.status.includes("Scanning") || data.status.includes("Extinguishing")) {
                    statusEl.classList.add('text-orange-400');
                    statusEl.classList.remove('text-green-400');
                } else {
                    statusEl.classList.add('text-green-400');
                    statusEl.classList.remove('text-orange-400');
                }

                // Sync auto button state if overridden by firmware
                if (data.mode === "Auto" && !isAuto) toggleAuto();
                if (data.mode === "Manual" && isAuto) toggleAuto();

            } catch (err) {
                document.getElementById('connectionStatus').innerText = "● Disconnected";
                document.getElementById('connectionStatus').classList.replace('text-green-500', 'text-red-500');
                document.getElementById('connectionStatus').classList.replace('text-gray-400', 'text-red-500');
                document.getElementById('sysStatus').innerText = "Connection Lost";
            }
        }

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            fetchStatus(); 
            pollInterval = setInterval(fetchStatus, 1000); // Fetch data every 1 second
        }

        recognition.onresult = (event) => {
            const last = event.results.length - 1;
            const command = event.results[last][0].transcript.trim().toLowerCase();
            document.getElementById('voiceOutput').innerText = `Heard: "${command}"`;

            if (command.includes('forward') || command.includes('go')) sendCommand('forward');
            else if (command.includes('back')) sendCommand('backward');
            else if (command.includes('left')) sendCommand('left');
            else if (command.includes('right')) sendCommand('right');
            else if (command.includes('stop')) sendCommand('stop');
            else if (command.includes('water') || command.includes('pump') || command.includes('fire')) {
                 sendCommand('pump_on');
                 setTimeout(() => sendCommand('pump_off'), 2000); // Spray for 2 seconds
            }
            else if (command.includes('auto on') || command.includes('automatic')) {
                 if(!isAuto) toggleAuto();
            }
            else if (command.includes('auto off') || command.includes('manual')) {
                 if(isAuto) toggleAuto();
            }
        };

        function toggleVoice() {
            const btn = document.getElementById('voiceBtn');
            if (!isVoiceActive) {
                try {
                    recognition.start();
                    isVoiceActive = true;
                    btn.classList.replace('bg-green-600', 'bg-red-600');
                    btn.classList.replace('hover:bg-green-700', 'hover:bg-red-700');
                    btn.innerHTML = '<i class="fas fa-microphone-slash mr-2 text-xl"></i> Stop Voice Control';
                    document.getElementById('voiceOutput').innerText = "Listening for commands...";
                } catch(e) {
                    alert("Voice control is not supported by your browser or microphone access was denied.");
                }
            } else {
                recognition.stop();
                isVoiceActive = false;
                btn.classList.replace('bg-red-600', 'bg-green-600');
                btn.classList.replace('hover:bg-red-700', 'hover:bg-green-700');
                btn.innerHTML = '<i class="fas fa-microphone mr-2 text-xl"></i> Start Voice Control';
                document.getElementById('voiceOutput').innerText = "";
            }
        }

        // --- Virtual Joystick (nipple.js) ---
        const joystickZone = document.getElementById('joystick-zone');
        const manager = nipplejs.create({
            zone: joystickZone,
            mode: 'static',
            position: { left: '50%', top: '50%' },
            color: '#3b82f6', // Tailwind blue-500
            size: 140
        });

        // Trigger movement when dragging the joystick
        manager.on('dir:up', () => { if(currentCommand !== 'forward') { currentCommand = 'forward'; sendCommand('forward'); } });
        manager.on('dir:down', () => { if(currentCommand !== 'backward') { currentCommand = 'backward'; sendCommand('backward'); } });
        manager.on('dir:left', () => { if(currentCommand !== 'left') { currentCommand = 'left'; sendCommand('left'); } });
        manager.on('dir:right', () => { if(currentCommand !== 'right') { currentCommand = 'right'; sendCommand('right'); } });
        
        // Stop moving when joystick is released
        manager.on('end', () => { currentCommand = null; sendCommand('stop'); });

        // --- Keyboard Controls (WASD & Arrows) ---
        document.addEventListener('keydown', (e) => {
            // Ignore if typing in the IP box or if Auto mode is ON
            if (isAuto || document.activeElement.tagName === 'INPUT') return;
            
            // Prevent page scrolling when using arrow keys
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
                e.preventDefault();
            }
            
            let dir = null;
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') dir = 'forward';
            if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') dir = 'backward';
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') dir = 'left';
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') dir = 'right';

            if (dir && currentCommand !== dir) {
                currentCommand = dir;
                sendCommand(dir);
            }
        });

        document.addEventListener('keyup', (e) => {
            if (isAuto || document.activeElement.tagName === 'INPUT') return;
            
            let dir = null;
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') dir = 'forward';
            if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') dir = 'backward';
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') dir = 'left';
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') dir = 'right';

            // Only send 'stop' if the key released is the current active direction
            if (dir === currentCommand) {
                currentCommand = null;
                sendCommand('stop');
            }
        });
    </script>
</body>
</html>
